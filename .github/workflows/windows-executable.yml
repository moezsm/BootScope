name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained executable
        run: dotnet publish BootScope/BootScope.csproj --configuration Release --no-restore --property:PublishProfile=Windows-x64

      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path BootScope/bin/Release/net8.0-windows/win-x64/publish/* -DestinationPath BootScope-win-x64.zip

      - name: Upload executable package
        uses: actions/upload-artifact@v4
        with:
          name: BootScope-win-x64
          path: BootScope-win-x64.zip
          if-no-files-found: error
